services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: grocery
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: mysql://root:rootpw@mysql:3306/grocery
      JWT_SECRET: dev-secret-change-me
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
    command: sh -c "yes '' | pnpm exec drizzle-kit push --force && pnpm dev:server"

  metro:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      EXPO_PORT: "8081"
      EXPO_PUBLIC_API_BASE_URL: http://localhost:3000
      EXPO_NO_TELEMETRY: "1"
      BROWSER: none
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - metro-node-modules:/app/node_modules
    command: pnpm dev:metro

volumes:
  mysql-data:
  api-node-modules:
  metro-node-modules:
